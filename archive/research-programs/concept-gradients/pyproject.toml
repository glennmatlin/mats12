[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mats-concept-filtering"
version = "0.1.0"
description = "Receipt-bound reconstruction tooling for the MATS concept-filtering project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=23,<24",
]

[project.scripts]
concept-filtering = "concept_filtering.cli:main"

[project.optional-dependencies]
inference = [
    "huggingface-hub>=0.36,<2",
    "peft==0.18.1",
    "sae-lens==6.42.0",
    "torch>=2.8,<3",
    "transformers>=4.57,<5",
]
attribution = [
    "kronfluence==1.0.1",
    "torch>=2.8,<3",
]

[dependency-groups]
dev = [
  "pyarrow-stubs>=20.0.0.20260625",
  "pyright>=1.1.404",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/concept_filtering"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
